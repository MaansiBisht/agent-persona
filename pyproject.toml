[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-persona"
version = "0.3.2"
description = "Local-first personalization layer for Claude CLI — learns how you work and injects that context into every session"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "filelock>=3.12",
    "questionary>=2.0",
]

[project.scripts]
agent-persona = "agent_persona.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_persona"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["agent_persona"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
